<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Diretoria - LAPE</title>
    <link rel="stylesheet" href="style.css">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyBB69rrvrFCJSrkCyScQl6JDeiSNees3qA",
        authDomain: "app-lape.firebaseapp.com",
        projectId: "app-lape"
      };
      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();
    </script>
</head>
<body class="fundo-app">

    <div class="celular-container" style="max-width: 540px;">
        
        <header class="cabecalho">
            <h2>Gestão da Liga (Admin)</h2>
            <button class="btn-perfil" onclick="window.location.href='index.html'">Sair</button>
        </header>

        <!-- Navegação por Abas -->
        <nav class="admin-abas-complexa">
            <button class="aba-btn ativo" onclick="mudarAba('cadastro-membros', event)">➕ Membros</button>
            <button class="aba-btn" onclick="mudarAba('lista-membros', event)">👥 Alunos</button>
            <button class="aba-btn" onclick="mudarAba('cadastro-atividades', event)">➕ Ativ.</button>
            <button class="aba-btn" onclick="mudarAba('lista-atividades', event)">📅 Gerenciar</button>
            <button class="aba-btn" onclick="mudarAba('frequencia', event)">📋 Frequência</button>
            <button class="aba-btn" onclick="mudarAba('avisos', event)">⚠️ Avisos</button>
        </nav>

        <!-- ABA 1: CADASTRAR MEMBROS -->
        <div id="secao-cadastro-membros" class="admin-secao">
            <div class="admin-card-acao">
                <h3>Cadastrar Novo Membro</h3>
                <div class="grid-form">
                    <input type="text" id="m-nome" placeholder="Nome Completo *" class="col-full" required>
                    <input type="email" id="m-email" placeholder="E-mail *" required>
                    <input type="text" id="m-tel" placeholder="Telefone">
                    <input type="text" id="m-curso" placeholder="Curso (Ex: Medicina)">
                    <input type="text" id="m-periodo" placeholder="Período (Ex: 5º)">
                    <input type="number" id="m-ingresso-liga" placeholder="Ano Ingresso (Ex: 2026)">
                    <select id="m-cargo" class="col-full">
                        <option value="Ligante">Ligante</option>
                        <option value="Presidente">Presidente</option>
                    </select>
                </div>
                <button class="btn-salvar" onclick="cadastrarMembro()">Salvar e Gerar Código</button>
            </div>
        </div>

        <!-- ABA 2: LISTA DE MEMBROS -->
        <div id="secao-lista-membros" class="admin-secao" style="display: none;">
            <div class="cabecalho-lista">
                <h3>Membros Cadastrados</h3>
                <span class="badge-total" id="total-membros">0 cadastrados</span>
            </div>
            <div id="lista-admin-membros"></div>
        </div>

        <!-- ABA 3: CADASTRAR ATIVIDADES -->
        <div id="secao-cadastro-atividades" class="admin-secao" style="display: none;">
            <div class="admin-card-acao">
                <h3>Nova Atividade</h3>
                <div class="grid-form">
                    <input type="text" id="at-titulo" placeholder="Título *" class="col-full">
                    <input type="date" id="at-data">
                    <input type="time" id="at-hora">
                    <input type="text" id="at-local" placeholder="Local">
                    <input type="number" id="at-ch" placeholder="Carga Horária (h)">
                    <textarea id="at-desc" rows="3" placeholder="Descrição..." class="col-full"></textarea>
                </div>
                <button class="btn-salvar" onclick="cadastrarAtividade()">Criar Atividade na Nuvem</button>
            </div>
        </div>

        <!-- ABA 4: LISTA DE ATIVIDADES -->
        <div id="secao-lista-atividades" class="admin-secao" style="display: none;">
            <h3>Atividades Cadastradas</h3>
            <div id="lista-admin-atividades-edicao"></div>
        </div>

        <!-- ABA 5: FREQUÊNCIA INTEGRADA -->
        <div id="secao-frequencia" class="admin-secao" style="display: none;">
            <h3>Controle de Frequência e Justificativas</h3>
            <p class="subtexto-admin">Gerencie as presenças enviadas pelos ligantes em tempo real.</p>
            <div id="lista-admin-frequencia"></div>
        </div>

        <!-- ABA 6: AVISOS -->
        <div id="secao-avisos" class="admin-secao" style="display: none;">
            <div class="admin-card-acao">
                <h3>Publicar Aviso</h3>
                <input type="text" id="av-titulo" placeholder="Título">
                <textarea id="av-texto" rows="3" placeholder="Mensagem..."></textarea>
                <button class="btn-salvar" onclick="cadastrarAviso()">Publicar na Nuvem</button>
            </div>
            <div id="lista-admin-avisos"></div>
        </div>
    </div>

    <script>
        let membrosCache = [];
        let atividadesCache = [];

        function mudarAba(nome, evento) {
            document.querySelectorAll('.admin-secao').forEach(s => s.style.display = 'none');
            document.querySelectorAll('.aba-btn').forEach(b => b.classList.remove('ativo'));
            document.getElementById(`secao-${nome}`).style.display = 'block';
            evento.target.classList.add('ativo');
        }

        async function carregarDadosAdmin() {
            // Membros
            let mSnap = await db.collection("membros").get();
            membrosCache = [];
            let divM = document.getElementById("lista-admin-membros");
            divM.innerHTML = "";
            document.getElementById("total-membros").innerText = `${mSnap.size} cadastrados`;

            mSnap.forEach(doc => {
                let m = { id: doc.id, ...doc.data() };
                membrosCache.push(m);
                divM.innerHTML += `
                    <div class="card-admin-item">
                        <h4>${m.nome}</h4>
                        <p><strong>Código:</strong> <code>${m.codigo}</code> | <strong>Senha:</strong> ${m.senhaPadrao}</p>
                        <p><strong>Curso:</strong> ${m.curso} | <strong>Cargo:</strong> ${m.cargo}</p>
                        <button class="btn-mini vermelho" onclick="removerMembro('${m.id}')">Excluir</button>
                    </div>
                `;
            });

            // Atividades
            let atSnap = await db.collection("atividades").get();
            atividadesCache = [];
            atSnap.forEach(doc => {
                atividadesCache.push({ id: doc.id, ...doc.data() });
            });

            renderizarAtividadesEdicao();
            renderizarFrequenciaAdmin();
            carregarAvisosAdmin();
        }

        async function cadastrarMembro() {
            let nome = document.getElementById('m-nome').value;
            let email = document.getElementById('m-email').value;
            let anoIng = document.getElementById('m-ingresso-liga').value;

            if(!nome || !email || !anoIng) { alert("Preencha Nome, E-mail e Ano de Ingresso."); return; }
            let codigoGerado = `${anoIng}1${Math.floor(Math.random() * 900) + 100}`;

            await db.collection("membros").add({
                codigo: codigoGerado,
                senhaPadrao: "LAPE2026",
                nome, email,
                tel: document.getElementById('m-tel').value,
                curso: document.getElementById('m-curso').value,
                periodo: document.getElementById('m-periodo').value,
                cargo: document.getElementById('m-cargo').value
            });

            alert(`Membro cadastrado!\nCódigo: ${codigoGerado}\nSenha: LAPE2026`);
            carregarDadosAdmin();
            mudarAba('lista-membros', { target: document.querySelectorAll('.aba-btn')[1] });
        }

        async function removerMembro(id) {
            if(confirm("Deseja apagar este membro?")) {
                await db.collection("membros").doc(id).delete();
                carregarDadosAdmin();
            }
        }

        async function cadastrarAtividade() {
            let titulo = document.getElementById('at-titulo').value;
            let data = document.getElementById('at-data').value;
            if(!titulo || !data) { alert("Preencha Título e Data."); return; }

            await db.collection("atividades").add({
                titulo, data,
                hora: document.getElementById('at-hora').value || "19:00",
                local: document.getElementById('at-local').value || "Local a definir",
                ch: Number(document.getElementById('at-ch').value || 0),
                desc: document.getElementById('at-desc').value || "",
                frequencias: {}
            });

            alert("Atividade criada com sucesso!");
            carregarDadosAdmin();
            mudarAba('lista-atividades', { target: document.querySelectorAll('.aba-btn')[3] });
        }

        function renderizarAtividadesEdicao() {
            let div = document.getElementById("lista-admin-atividades-edicao");
            div.innerHTML = "";
            if(atividadesCache.length === 0) { div.innerHTML = "<p class='cinza'>Nenhuma atividade cadastrada.</p>"; return; }

            atividadesCache.forEach(a => {
                div.innerHTML += `
                    <div class="card-admin-item flex-row">
                        <div><h4>${a.titulo}</h4><p class="cinza">${a.data} - ${a.hora} | CH: ${a.ch}h</p></div>
                        <button class="btn-mini vermelho" onclick="removerAtividade('${a.id}')">Apagar</button>
                    </div>
                `;
            });
        }

        async function removerAtividade(id) {
            if(confirm("Apagar atividade?")) {
                await db.collection("atividades").doc(id).delete();
                carregarDadosAdmin();
            }
        }

        // --- FREQUÊNCIA INTEGRADA ---
        function renderizarFrequenciaAdmin() {
            let div = document.getElementById("lista-admin-frequencia");
            div.innerHTML = "";

            if(atividadesCache.length === 0) {
                div.innerHTML = "<p class='cinza'>Nenhuma atividade disponível para gerenciar frequência.</p>";
                return;
            }

            atividadesCache.forEach(a => {
                let frequenciasMap = a.frequencias || {};
                let htmlMembros = "";

                membrosCache.forEach(m => {
                    let reg = frequenciasMap[m.id] || { status: 'pendente', texto: '' };
                    let badgeStatus = `<span class="tag-status pendente">Pendente</span>`;
                    
                    if(reg.status === 'presente') badgeStatus = `<span class="tag-status presente">✓ Presente</span>`;
                    if(reg.status === 'justificado') badgeStatus = `<span class="tag-status justificado">Justificativa Pendente</span>`;
                    if(reg.status === 'negado') badgeStatus = `<span class="tag-status falta">Justif. Negada</span>`;

                    let blocoJustificativa = (reg.status === 'justificado' && reg.texto) ? `
                        <div class="caixa-justificativa-admin" style="margin:5px 0;">
                            <p><strong>Justificativa:</strong> "${reg.texto}"</p>
                            <div class="botoes-justica" style="margin-top:4px;">
                                <button class="btn-mini verde" onclick="avaliarJustificativa('${a.id}', '${m.id}', 'presente')">Aceitar</button>
                                <button class="btn-mini vermelho" onclick="avaliarJustificativa('${a.id}', '${m.id}', 'negado')">Negar</button>
                            </div>
                        </div>
                    ` : '';

                    htmlMembros += `
                        <div class="item-chamada" style="margin-bottom:8px;">
                            <div class="chamada-info">
                                <strong>${m.nome}</strong>
                                ${badgeStatus}
                            </div>
                            ${blocoJustificativa}
                            <div class="botoes-presenca" style="margin-top:4px;">
                                <button class="btn-mini verde" onclick="mudarStatusAdmin('${a.id}', '${m.id}', 'presente')">Dar Presença</button>
                                <button class="btn-mini vermelho" onclick="mudarStatusAdmin('${a.id}', '${m.id}', 'negado')">Marcar Falta</button>
                            </div>
                        </div>
                    `;
                });

                div.innerHTML += `
                    <div class="card-admin-item">
                        <h4>${a.titulo}</h4>
                        <p class="cinza">${a.data} • CH: ${a.ch}h</p>
                        <div class="bloco-chamada-membros" style="margin-top:10px;">
                            ${htmlMembros}
                        </div>
                    </div>
                `;
            });
        }

        async function mudarStatusAdmin(ativId, ligId, novoStatus) {
            let ativ = atividadesCache.find(x => x.id === ativId);
            if(!ativ) return;
            if(!ativ.frequencias) ativ.frequencias = {};
            if(!ativ.frequencias[ligId]) ativ.frequencias[ligId] = {};
            
            ativ.frequencias[ligId].status = novoStatus;

            await db.collection("atividades").doc(ativId).update({
                frequencias: ativ.frequencias
            });
            carregarDadosAdmin();
        }

        async function avaliarJustificativa(ativId, ligId, acao) {
            await mudarStatusAdmin(ativId, ligId, acao);
        }

        async function cadastrarAviso() {
            let titulo = document.getElementById('av-titulo').value;
            let texto = document.getElementById('av-texto').value;
            if(!titulo) return;
            await db.collection("avisos").add({ titulo, texto });
            alert("Aviso publicado!");
            carregarDadosAdmin();
        }

        async function carregarAvisosAdmin() {
            let div = document.getElementById("lista-admin-avisos");
            div.innerHTML = "";
            let snap = await db.collection("avisos").get();
            snap.forEach(doc => {
                let a = doc.data();
                div.innerHTML += `<div class="card-admin-item"><h4>${a.titulo}</h4><p class="cinza">${a.texto}</p></div>`;
            });
        }

        window.onload = carregarDadosAdmin;
    </script>
</body>
</html>
