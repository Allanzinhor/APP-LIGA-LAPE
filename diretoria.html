<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Diretoria - LAPE</title>
    <link rel="stylesheet" href="style.css">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyBB69rrvrFCJSrkCyScQl6JDeiSNees3qA",
        authDomain: "app-lape.firebaseapp.com",
        projectId: "app-lape"
      };
      firebase.initializeApp(firebaseConfig);
      const db = firebase.firestore();
    </script>
</head>
<body class="fundo-app">

    <div class="celular-container" style="max-width: 580px;">
        
        <header class="cabecalho">
            <h2>Gestão da Liga (Admin)</h2>
            <button class="btn-perfil" onclick="window.location.href='index.html'">Sair</button>
        </header>

        <!-- Navegação por Abas -->
        <nav class="admin-abas-complexa" style="grid-template-columns: repeat(3, 1fr);">
            <button class="aba-btn ativo" onclick="mudarAba('cadastro-membros', event)">➕ Membros</button>
            <button class="aba-btn" onclick="mudarAba('lista-membros', event)">👥 Alunos</button>
            <button class="aba-btn" onclick="mudarAba('cadastro-atividades', event)">➕ Ativ.</button>
            <button class="aba-btn" onclick="mudarAba('lista-atividades', event)">📅 Gerenciar</button>
            <button class="aba-btn" onclick="mudarAba('frequencia', event)">📋 Frequência</button>
            <button class="aba-btn" onclick="mudarAba('financeiro', event)">💰 Financeiro</button>
            <button class="aba-btn" onclick="mudarAba('avisos', event)">⚠️ Avisos</button>
        </nav>

        <!-- ABA 1: CADASTRAR MEMBROS -->
        <div id="secao-cadastro-membros" class="admin-secao">
            <div class="admin-card-acao">
                <h3>Cadastrar Novo Membro</h3>
                <div class="grid-form">
                    <input type="text" id="m-nome" placeholder="Nome Completo *" class="col-full" required>
                    <input type="email" id="m-email" placeholder="E-mail *" required>
                    <input type="text" id="m-tel" placeholder="Telefone">
                    <input type="text" id="m-curso" placeholder="Curso (Ex: Medicina)">
                    <input type="text" id="m-periodo" placeholder="Período (Ex: 5º)">
                    <input type="number" id="m-ingresso-liga" placeholder="Ano Ingresso (Ex: 2026)">
                    <select id="m-cargo" class="col-full">
                        <option value="Ligante">Ligante</option>
                        <option value="Presidente">Presidente</option>
                    </select>
                </div>
                <button class="btn-salvar" onclick="cadastrarMembro()">Salvar e Gerar Código</button>
            </div>
        </div>

        <!-- ABA 2: LISTA DE MEMBROS -->
        <div id="secao-lista-membros" class="admin-secao" style="display: none;">
            <div class="cabecalho-lista">
                <h3>Membros Cadastrados</h3>
                <span class="badge-total" id="total-membros">0 cadastrados</span>
            </div>
            <div id="lista-admin-membros"></div>
        </div>

        <!-- ABA 3: CADASTRAR ATIVIDADES -->
        <div id="secao-cadastro-atividades" class="admin-secao" style="display: none;">
            <div class="admin-card-acao">
                <h3>Nova Atividade</h3>
                <div class="grid-form">
                    <input type="text" id="at-titulo" placeholder="Título *" class="col-full">
                    <input type="date" id="at-data">
                    <input type="time" id="at-hora">
                    <input type="text" id="at-local" placeholder="Local">
                    <input type="number" id="at-ch" placeholder="Carga Horária (h)">
                    <textarea id="at-desc" rows="3" placeholder="Descrição..." class="col-full"></textarea>
                </div>
                <button class="btn-salvar" onclick="cadastrarAtividade()">Criar Atividade na Nuvem</button>
            </div>
        </div>

        <!-- ABA 4: LISTA DE ATIVIDADES -->
        <div id="secao-lista-atividades" class="admin-secao" style="display: none;">
            <div class="admin-card-acao filtro-financeiro" style="margin-bottom: 15px;">
                <h3>Filtrar Atividades por Mês/Ano</h3>
                <select id="filtro-mes-atividades" onchange="renderizarAtividadesEdicao()">
                    <option value="2025-08">Agosto / 2025</option>
                    <option value="2025-09">Setembro / 2025</option>
                    <option value="2025-10">Outubro / 2025</option>
                    <option value="2025-11">Novembro / 2025</option>
                    <option value="2025-12">Dezembro / 2025</option>
                    <option value="2026-06">Junho / 2026</option>
                    <option value="2026-07">Julho / 2026</option>
                    <option value="2026-08" selected>Agosto / 2026</option>
                    <option value="2026-09">Setembro / 2026</option>
                    <option value="2026-10">Outubro / 2026</option>
                    <option value="2026-11">Novembro / 2026</option>
                    <option value="2026-12">Dezembro / 2026</option>
                </select>
            </div>
            <h3>Atividades Cadastradas</h3>
            <div id="lista-admin-atividades-edicao"></div>
        </div>

        <!-- ABA 5: FREQUÊNCIA -->
        <div id="secao-frequencia" class="admin-secao" style="display: none;">
            <div class="admin-card-acao filtro-financeiro" style="margin-bottom: 15px;">
                <h3>Controle de Frequência por Mês/Ano</h3>
                <select id="filtro-mes-frequencia" onchange="renderizarFrequenciaAdmin()">
                    <option value="2025-08">Agosto / 2025</option>
                    <option value="2025-09">Setembro / 2025</option>
                    <option value="2025-10">Outubro / 2025</option>
                    <option value="2025-11">Novembro / 2025</option>
                    <option value="2025-12">Dezembro / 2025</option>
                    <option value="2026-06">Junho / 2026</option>
                    <option value="2026-07">Julho / 2026</option>
                    <option value="2026-08" selected>Agosto / 2026</option>
                    <option value="2026-09">Setembro / 2026</option>
                    <option value="2026-10">Outubro / 2026</option>
                    <option value="2026-11">Novembro / 2026</option>
                    <option value="2026-12">Dezembro / 2026</option>
                </select>
            </div>
            <div id="lista-admin-frequencia"></div>
        </div>

        <!-- ABA 6: FINANCEIRO -->
        <div id="secao-financeiro" class="admin-secao" style="display: none;">
            <div class="admin-card-acao filtro-financeiro" style="margin-bottom: 15px;">
                <h3>Gestão de Mensalidades por Mês</h3>
                <select id="filtro-mes-financeiro" onchange="renderizarFinanceiroAdmin()">
                    <option value="2025-08">Agosto / 2025</option>
                    <option value="2025-09">Setembro / 2025</option>
                    <option value="2025-10">Outubro / 2025</option>
                    <option value="2025-11">Novembro / 2025</option>
                    <option value="2025-12">Dezembro / 2025</option>
                    <option value="2026-06">Junho / 2026</option>
                    <option value="2026-07">Julho / 2026</option>
                    <option value="2026-08" selected>Agosto / 2026</option>
                    <option value="2026-09">Setembro / 2026</option>
                    <option value="2026-10">Outubro / 2026</option>
                    <option value="2026-11">Novembro / 2026</option>
                    <option value="2026-12">Dezembro / 2026</option>
                </select>
            </div>
            <div id="lista-admin-financeiro"></div>
        </div>

        <!-- ABA 7: AVISOS -->
        <div id="secao-avisos" class="admin-secao" style="display: none;">
            <div class="admin-card-acao">
                <h3 id="titulo-form-aviso">Publicar Novo Aviso</h3>
                <input type="hidden" id="av-id-editando">
                <input type="text" id="av-titulo" placeholder="Título">
                <textarea id="av-texto" rows="3" placeholder="Mensagem..."></textarea>
                <button class="btn-salvar" id="btn-salvar-aviso" onclick="salvarAviso()">Publicar na Nuvem</button>
                <button class="btn-mini cinza" id="btn-cancelar-aviso" style="display:none; width:100%; margin-top:5px; padding:10px;" onclick="cancelarEdicaoAviso()">Cancelar Edição</button>
            </div>
            <h3>Avisos Publicados</h3>
            <div id="lista-admin-avisos"></div>
        </div>
    </div>

    <script>
        let membrosCache = [];
        let atividadesCache = [];
        let avisosCache = [];

        function mudarAba(nome, evento) {
            document.querySelectorAll('.admin-secao').forEach(s => s.style.display = 'none');
            document.querySelectorAll('.aba-btn').forEach(b => b.classList.remove('ativo'));
            document.getElementById(`secao-${nome}`).style.display = 'block';
            evento.target.classList.add('ativo');
        }

        async function carregarDadosAdmin() {
            let mSnap = await db.collection("membros").get();
            membrosCache = [];
            let divM = document.getElementById("lista-admin-membros");
            divM.innerHTML = "";
            document.getElementById("total-membros").innerText = `${mSnap.size} cadastrados`;

            mSnap.forEach(doc => {
                let m = { id: doc.id, ...doc.data() };
                membrosCache.push(m);
                divM.innerHTML += `
                    <div class="card-admin-item">
                        <h4>${m.nome}</h4>
                        <p><strong>Código:</strong> <code>${m.codigo}</code> | <strong>Senha:</strong> ${m.senhaPadrao}</p>
                        <p><strong>Curso:</strong> ${m.curso} | <strong>Cargo:</strong> ${m.cargo}</p>
                        <button class="btn-mini vermelho" onclick="removerMembro('${m.id}')">Excluir</button>
                    </div>
                `;
            });

            let atSnap = await db.collection("atividades").get();
            atividadesCache = [];
            atSnap.forEach(doc => {
                atividadesCache.push({ id: doc.id, ...doc.data() });
            });
            atividadesCache.sort((a, b) => new Date(a.data + "T" + (a.hora || "00:00")) - new Date(b.data + "T" + (b.hora || "00:00")));

            renderizarAtividadesEdicao();
            renderizarFrequenciaAdmin();
            renderizarFinanceiroAdmin();
            carregarAvisosAdmin();
        }

        async function cadastrarMembro() {
            let nome = document.getElementById('m-nome').value;
            let email = document.getElementById('m-email').value;
            let anoIng = document.getElementById('m-ingresso-liga').value;

            if(!nome || !email || !anoIng) { alert("Preencha Nome, E-mail e Ano de Ingresso."); return; }
            let codigoGerado = `${anoIng}1${Math.floor(Math.random() * 900) + 100}`;

            await db.collection("membros").add({
                codigo: codigoGerado,
                senhaPadrao: "LAPE2026",
                nome, email,
                tel: document.getElementById('m-tel').value,
                curso: document.getElementById('m-curso').value,
                periodo: document.getElementById('m-periodo').value,
                cargo: document.getElementById('m-cargo').value,
                financeiro: {}
            });

            alert(`Membro cadastrado!\nCódigo: ${codigoGerado}\nSenha: LAPE2026`);
            carregarDadosAdmin();
            mudarAba('lista-membros', { target: document.querySelectorAll('.aba-btn')[1] });
        }

        async function removerMembro(id) {
            if(confirm("Deseja apagar este membro?")) {
                await db.collection("membros").doc(id).delete();
                carregarDadosAdmin();
            }
        }

        async function cadastrarAtividade() {
            let titulo = document.getElementById('at-titulo').value;
            let data = document.getElementById('at-data').value;
            if(!titulo || !data) { alert("Preencha Título e Data."); return; }

            await db.collection("atividades").add({
                titulo, data,
                hora: document.getElementById('at-hora').value || "19:00",
                local: document.getElementById('at-local').value || "Local a definir",
                ch: Number(document.getElementById('at-ch').value || 0),
                desc: document.getElementById('at-desc').value || "",
                frequencias: {}
            });

            alert("Atividade criada com sucesso!");
            document.getElementById('filtro-mes-atividades').value = data.substring(0, 7);
            document.getElementById('filtro-mes-frequencia').value = data.substring(0, 7);

            carregarDadosAdmin();
            mudarAba('lista-atividades', { target: document.querySelectorAll('.aba-btn')[3] });
        }

        function renderizarAtividadesEdicao() {
            let mesFiltro = document.getElementById("filtro-mes-atividades").value;
            let div = document.getElementById("lista-admin-atividades-edicao");
            div.innerHTML = "";

            let filtradas = atividadesCache.filter(a => a.data && a.data.startsWith(mesFiltro));
            if(filtradas.length === 0) { 
                div.innerHTML = "<p class='cinza'>Nenhuma atividade cadastrada para este mês/ano.</p>"; 
                return; 
            }

            filtradas.forEach(a => {
                div.innerHTML += `
                    <div class="card-admin-item flex-row">
                        <div><h4>${a.titulo}</h4><p class="cinza">${a.data} - ${a.hora} | CH: ${a.ch}h</p></div>
                        <button class="btn-mini vermelho" onclick="removerAtividade('${a.id}')">Apagar</button>
                    </div>
                `;
            });
        }

        async function removerAtividade(id) {
            if(confirm("Apagar atividade?")) {
                await db.collection("atividades").doc(id).delete();
                carregarDadosAdmin();
            }
        }

        function renderizarFrequenciaAdmin() {
            let mesFiltro = document.getElementById("filtro-mes-frequencia").value;
            let div = document.getElementById("lista-admin-frequencia");
            div.innerHTML = "";

            let ativFiltradas = atividadesCache.filter(a => a.data && a.data.startsWith(mesFiltro));

            if(ativFiltradas.length === 0) {
                div.innerHTML = "<p class='cinza'>Nenhuma atividade disponível para este mês/ano.</p>";
                return;
            }

            ativFiltradas.forEach(a => {
                let frequenciasMap = a.frequencias || {};
                let htmlMembros = "";

                membrosCache.forEach(m => {
                    let reg = frequenciasMap[m.id] || { status: 'pendente', texto: '' };
                    let badgeStatus = `<span class="tag-status pendente">Pendente</span>`;
                    
                    if(reg.status === 'presente') badgeStatus = `<span class="tag-status presente">✓ Presente (Com CH)</span>`;
                    if(reg.status === 'justificado') badgeStatus = `<span class="tag-status justificado">✓ Justificado Aceito (Abonado)</span>`;
                    if(reg.status === 'negado') badgeStatus = `<span class="tag-status falta">✕ Falta / Justif. Negada</span>`;

                    let indicacaoAluno = reg.confirmadoAluno ? `<span style="font-size:10px; color:#1e88e5; display:block;">(Aluno confirmou interesse no app)</span>` : "";

                    let blocoJustificativaAcoes = "";
                    if (reg.status === 'aguardando_analise') {
                        blocoJustificativaAcoes = `
                            <div class="caixa-justificativa-admin" style="margin:5px 0; background:#fff8e1; padding:6px; border-radius:4px;">
                                <p style="font-size:11px;"><strong>Justificativa do Aluno:</strong> "${reg.texto}"</p>
                                <div class="botoes-justica" style="margin-top:4px;">
                                    <button class="btn-mini verde" onclick="mudarStatusAdmin('${a.id}', '${m.id}', 'justificado')">Aceitar Justificativa</button>
                                    <button class="btn-mini vermelho" onclick="mudarStatusAdmin('${a.id}', '${m.id}', 'negado')">Negar Justificativa (Falta)</button>
                                </div>
                            </div>
                        `;
                    } else {
                        blocoJustificativaAcoes = `
                            <div class="botoes-presenca" style="margin-top:6px;">
                                <button class="btn-mini verde" onclick="mudarStatusAdmin('${a.id}', '${m.id}', 'presente')">Dar Presença (+CH)</button>
                                <button class="btn-mini vermelho" onclick="mudarStatusAdmin('${a.id}', '${m.id}', 'negado')">Marcar Falta</button>
                                ${reg.status !== 'pendente' ? `<button class="btn-mini cinza" onclick="mudarStatusAdmin('${a.id}', '${m.id}', 'pendente')">Remover Status</button>` : ''}
                            </div>
                        `;
                    }

                    htmlMembros += `
                        <div class="item-chamada" style="margin-bottom:8px; background:#fff; padding:8px; border-radius:6px; border:1px solid #dee2e6;">
                            <div class="chamada-info">
                                <div>
                                    <strong>${m.nome}</strong>
                                    ${indicacaoAluno}
                                </div>
                                ${badgeStatus}
                            </div>
                            ${blocoJustificativaAcoes}
                        </div>
                    `;
                });

                div.innerHTML += `
                    <div class="card-admin-item">
                        <h4>${a.titulo}</h4>
                        <p class="cinza">${a.data} • CH: ${a.ch}h</p>
                        <div class="bloco-chamada-membros" style="margin-top:10px;">
                            ${htmlMembros}
                        </div>
                    </div>
                `;
            });
        }

        async function mudarStatusAdmin(ativId, ligId, novoStatus) {
            let ativ = atividadesCache.find(x => x.id === ativId);
            if(!ativ) return;
            if(!ativ.frequencias) ativ.frequencias = {};
            if(!ativ.frequencias[ligId]) ativ.frequencias[ligId] = {};
            
            ativ.frequencias[ligId].status = novoStatus;
            if(novoStatus === 'pendente') {
                ativ.frequencias[ligId].texto = '';
            }

            await db.collection("atividades").doc(ativId).update({
                frequencias: ativ.frequencias
            });
            carregarDadosAdmin();
        }

        // --- GESTÃO FINANCEIRA ADMIN ---
        function renderizarFinanceiroAdmin() {
            let mesFiltro = document.getElementById("filtro-mes-financeiro").value;
            let div = document.getElementById("lista-admin-financeiro");
            div.innerHTML = "";

            let [anoF, mesF] = mesFiltro.split('-').map(Number);
            let anoMesNum = anoF * 100 + mesF;
            let cobravel = anoMesNum >= 202508;

            if(!cobravel) {
                div.innerHTML = `<div class="card-admin-item"><p class="cinza">Mensalidades só começaram a ser cobradas a partir de Agosto de 2025.</p></div>`;
                return;
            }

            let htmlTabela = `
                <div class="card-admin-item">
                    <h4>Controle Financeiro - ${mesFiltro}</h4>
                    <table class="tabela-financeiro">
                        <thead>
                            <tr>
                                <th>Ligante</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            membrosCache.forEach(m => {
                let finMap = m.financeiro || {};
                let status = finMap[mesFiltro] || 'pendente';

                let badge = `<span class="badge-fin pendente">Pendente</span>`;
                if(status === 'pago') badge = `<span class="badge-fin pago">Pago ✓</span>`;
                if(status === 'analise') badge = `<span class="badge-fin analise">Aguardando Confirmação</span>`;
                if(status === 'abonado') badge = `<span class="badge-fin abonado">Abonado (R$ 0)</span>`;

                let botoesFin = `
                    <button class="btn-mini verde" onclick="alterarFinanceiroAdmin('${m.id}', '${mesFiltro}', 'pago')">Recebido</button>
                    <button class="btn-mini cinza" onclick="alterarFinanceiroAdmin('${m.id}', '${mesFiltro}', 'abonado')">Abonar</button>
                    <button class="btn-mini vermelho" onclick="alterarFinanceiroAdmin('${m.id}', '${mesFiltro}', 'pendente')">Resetar</button>
                `;

                htmlTabela += `
                    <tr>
                        <td><strong>${m.nome}</strong><br><small class="cinza">Cód: ${m.codigo}</small></td>
                        <td>${badge}</td>
                        <td>${botoesFin}</td>
                    </tr>
                `;
            });

            htmlTabela += `</tbody></table></div>`;
            div.innerHTML = htmlTabela;
        }

        async function alterarFinanceiroAdmin(membroId, mesAno, novoStatus) {
            let membro = membrosCache.find(x => x.id === membroId);
            if(!membro) return;
            if(!membro.financeiro) membro.financeiro = {};
            membro.financeiro[mesAno] = novoStatus;

            await db.collection("membros").doc(membroId).update({
                financeiro: membro.financeiro
            });
            carregarDadosAdmin();
        }

        // --- GESTÃO DE AVISOS ---
        async function salvarAviso() {
            let id = document.getElementById('av-id-editando').value;
            let titulo = document.getElementById('av-titulo').value.trim();
            let texto = document.getElementById('av-texto').value.trim();

            if(!titulo || !texto) { alert("Preencha o título e a mensagem do aviso."); return; }

            if(id) {
                await db.collection("avisos").doc(id).update({ titulo, texto });
                alert("Aviso atualizado com sucesso!");
            } else {
                await db.collection("avisos").add({ titulo, texto });
                alert("Aviso publicado com sucesso!");
            }

            cancelarEdicaoAviso();
            carregarAvisosAdmin();
        }

        async function carregarAvisosAdmin() {
            let div = document.getElementById("lista-admin-avisos");
            div.innerHTML = "";
            let snap = await db.collection("avisos").get();
            avisosCache = [];

            if(snap.empty) {
                div.innerHTML = "<p class='cinza'>Nenhum aviso publicado.</p>";
                return;
            }

            snap.forEach(doc => {
                let a = { id: doc.id, ...doc.data() };
                avisosCache.push(a);
                div.innerHTML += `
                    <div class="card-admin-item flex-row">
                        <div>
                            <h4>${a.titulo}</h4>
                            <p class="cinza">${a.texto}</p>
                        </div>
                        <div>
                            <button class="btn-mini cinza" onclick="prepararEdicaoAviso('${a.id}')">Editar</button>
                            <button class="btn-mini vermelho" onclick="removerAviso('${a.id}')">Apagar</button>
                        </div>
                    </div>
                `;
            });
        }

        function prepararEdicaoAviso(id) {
            let aviso = avisosCache.find(x => x.id === id);
            if(!aviso) return;
            document.getElementById('av-id-editando').value = aviso.id;
            document.getElementById('av-titulo').value = aviso.titulo;
            document.getElementById('av-texto').value = aviso.texto;
            document.getElementById('titulo-form-aviso').innerText = "Editar Aviso";
            document.getElementById('btn-salvar-aviso').innerText = "Salvar Alterações";
            document.getElementById('btn-cancelar-aviso').style.display = "block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelarEdicaoAviso() {
            document.getElementById('av-id-editando').value = "";
            document.getElementById('av-titulo').value = "";
            document.getElementById('av-texto').value = "";
            document.getElementById('titulo-form-aviso').innerText = "Publicar Novo Aviso";
            document.getElementById('btn-salvar-aviso').innerText = "Publicar na Nuvem";
            document.getElementById('btn-cancelar-aviso').style.display = "none";
        }

        async function removerAviso(id) {
            if(confirm("Deseja realmente apagar este aviso?")) {
                await db.collection("avisos").doc(id).delete();
                carregarAvisosAdmin();
            }
        }

        window.onload = carregarDadosAdmin;
    </script>
</body>
</html>
